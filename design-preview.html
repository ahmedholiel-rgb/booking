<script>
{
const P={
 'winter-day':['https://images.unsplash.com/photo-1651516246303-584f0f174762?w=1600&q=80&auto=format&fit=crop','center 40%','Nirmal Rajendharkumar','https://unsplash.com/photos/t6Mza1ulm7k'],
 'winter-night':['https://images.unsplash.com/photo-1546089572-95b941d9368d?w=1600&q=80&auto=format&fit=crop','center 30%','Fabrice Villard','https://unsplash.com/photos/UqGeqvrwBKg'],
 'summer-day':['https://images.unsplash.com/photo-1521292270410-a8c4d716d518?w=1600&q=80&auto=format&fit=crop','center 45%','Marco Meyer','https://unsplash.com/photos/eAAjKAGEKmI'],
 'summer-night':['https://images.unsplash.com/photo-1687095889647-fc51fedd0a71?w=1600&q=80&auto=format&fit=crop','center 40%','Joshua Kettle','https://unsplash.com/photos/FEyuZ2OV-Yk']
};
function scene(d){
  const m=d.getMonth()+1, h=d.getHours()+d.getMinutes()/60;
  const summer = m>=5 && m<=10;
  const night = summer ? (h<6 || h>=21) : (h<7.5 || h>=17.5);
  return (summer?'summer':'winter')+'-'+(night?'night':'day');
}
const N={'winter-day':'Winter · Tag','winter-night':'Winter · Nacht','summer-day':'Sommer · Tag','summer-night':'Sommer · Nacht'};
function show(k,auto){
  const p=P[k], h=document.getElementById('hero');
  h.style.backgroundImage="url('"+p[0]+"')"; h.style.backgroundPosition=p[1];
  const c=document.getElementById('credit'); c.textContent='Foto: '+p[2]+' / Unsplash'; c.href=p[3];
  document.getElementById('now').textContent=(auto?'Jetzt automatisch: ':'Test: ')+N[k];
}
document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.k; k==='auto'?show(scene(new Date()),true):show(k,false); }));
show(scene(new Date()),true);
}
