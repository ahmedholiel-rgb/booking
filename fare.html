<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests; img-src 'self' data:; connect-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fare">
<meta name="theme-color" content="#0F1419">
<title>Fare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f8a4c'/%3E%3Ctext x='32' y='40' font-family='Arial' font-weight='700' font-size='20' fill='%23fff' text-anchor='middle'%3ECHF%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-400.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-600.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-700.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:800;font-display:swap;src:url(fonts/inter-800.woff2) format('woff2')}

/*
VOICE: a driver's tool: fast, calm, one hand on the phone
IDEA: a taxi receipt being written: request on top, km lines, the total big
PICTURE: the big total with its breakdown, under the request card
COLOUR and TYPE: white, ink, signal green for accept, soft red for decline; system font
LAYOUT: one column, thumb-reachable buttons at the bottom
*/
:root{color-scheme:light dark;--bg:light-dark(#E9EEF2,#0B0F13);--card:light-dark(#fff,#151B21);--ink:light-dark(#0F1419,#E9EEF2);--mute:light-dark(#5B6B7B,#9AA7B4);--line:light-dark(#D5DDE4,#26303A);--field:light-dark(#F5F7F9,#1B232B);--acc:light-dark(#2F4A63,#9FB4C7);--ok:#187A52;--no:light-dark(#B42318,#FF8A80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
header{background:#0F1419;color:#fff;padding:14px 16px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:20px;display:block}header span{color:#9AA7B4;font-size:14px}
.lg{width:40px;height:40px;border-radius:10px;background:#fff;color:#0F1419;display:grid;place-items:center;font-weight:800;flex:none}
.chb{width:18px;height:18px;vertical-align:-3px;margin-left:6px}
main{max-width:560px;margin:0 auto;padding:12px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{font-size:16px;margin:0 0 8px}
.req{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px}
.req dt{color:var(--mute)}.req dd{margin:0;overflow-wrap:anywhere}
.empty{color:var(--mute);font-size:15px}
textarea,input{width:100%;font:16px Inter,-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;outline:none}
textarea{min-height:90px}
input:focus,textarea:focus{border-color:var(--acc)}
label{display:block;font-size:14px;color:var(--mute);font-weight:600;margin:12px 0 4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.big input{font-size:24px;font-weight:700;min-height:56px}
.tog{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--field)}
.tog input{width:22px;height:22px;min-height:0;margin:0;flex:none;accent-color:var(--ok)}
.tog span{font-weight:600}.tog small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.total{font-size:46px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.bd{color:var(--mute);font-size:14px;white-space:pre-line;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:12px;border:0;font:700 17px Inter,-apple-system,system-ui,sans-serif;cursor:pointer;margin-top:10px}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:none;border:1.5px solid var(--no);color:var(--no)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);min-height:46px;font-size:15px}
.btn:disabled{opacity:.45}
.links{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:14px}
.links a{color:var(--acc)}
.msg{white-space:pre-line;font-size:14px;color:var(--mute);background:var(--field);border-radius:10px;padding:10px;margin-top:10px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.seg button{flex:1;min-height:44px;border:0;background:var(--field);color:var(--ink);font:600 16px Inter,-apple-system,system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.warn{color:var(--no);font-size:14px;margin:8px 0 0}
.warn:empty{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="lg">AH</div><div><b>Fare <svg class="chb" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#C8102E"/><path d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z" fill="#fff"/></svg></b><span>Ahmed Holiel · privat</span></div></header>
<main>
  <section class="card" id="reqCard">
    <h2>Request</h2>
    <dl class="req" id="req"></dl>
    <p class="empty" id="empty">No request loaded. Copy the WhatsApp message, then tap Paste.</p>
    <button type="button" class="btn ghost" id="paste">Paste request</button>
    <details id="manualBox"><summary style="font-size:14px;color:var(--mute);margin-top:8px;cursor:pointer">Paste by hand</summary>
      <textarea id="manual" placeholder="Paste the WhatsApp message here"></textarea>
      <button type="button" class="btn ghost" id="read">Read</button>
    </details>
    <p class="warn" id="reqWarn"></p>
  </section>

  <section class="card">
    <div class="big"><label for="pick">Km to pickup</label><input id="pick" inputmode="decimal" placeholder="e.g. 12" autocomplete="off"></div>
    <div class="row">
      <div><label for="trip">Trip km</label><input id="trip" inputmode="decimal"></div>
      <div><label for="back">Way back km</label><input id="back" inputmode="decimal"></div>
    </div>
    <label class="tog"><input type="checkbox" id="hot"><span>Drop-off in hot zone<small id="hotTxt">Way back counts 0 km</small></span></label>
    <div class="row">
      <div><label for="bags">Bags (CHF 3)</label><input id="bags" inputmode="numeric" value="0"></div>
      <div><label for="seats">Child seats (CHF 3)</label><input id="seats" inputmode="numeric" value="0"></div>
    </div>
    <label class="tog"><input type="checkbox" id="wc"><span>Wheelchair<small>+ CHF 3</small></span></label>
  </section>

  <section class="card">
    <div class="total" id="total">CHF –</div>
    <div class="bd" id="bd">Type the km to pickup.</div>
    <label>Reply language</label>
    <div class="seg" role="group" aria-label="Reply language"><button type="button" id="lgDE" aria-pressed="true">Deutsch</button><button type="button" id="lgEN" aria-pressed="false">English</button></div>
    <label for="price">Price to send</label>
    <input id="price" inputmode="decimal">
    <button type="button" class="btn ok" id="accept">✓ Accept – send price</button>
    <button type="button" class="btn no" id="decline">✕ Not available</button>
    <div class="links"><a href="#" id="smsOk">Accept by SMS</a><a href="#" id="smsNo">Decline by SMS</a></div>
    <p class="warn" id="sendWarn"></p>
    <div class="msg" id="preview"></div>
  </section>
</main>

<script src="fare.js"></script>
</body>
</html>
